[project]
name = "django-workspaces"
description = "Django reusable app to manage user workspaces"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Christian Hartung", email = "hartung@live.com" },
]
keywords = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Framework :: Django :: 6.1",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "asgiref",
  "django",
  "django-stubs-ext",
  "typing-extensions; python_version<'3.13'",
]
dynamic = ["version"]

[project.urls]
Documentation = "https://github.com/hartungstenio/django-workspaces#readme"
Issues = "https://github.com/hartungstenio/django-workspaces/issues"
Source = "https://github.com/hartungstenio/django-workspaces"

[project.optional-dependencies]
channels = ["channels"]

[dependency-groups]
dev = [
  "coverage[toml] (>=6.5)",
  "deptry",
  "pre-commit",
  "pytest",
  "pytest-asyncio",
  "pytest-deadfixtures",
  "pytest-django",
  "ruff",
  { include-group = "types" },
]
types = [
  "django-stubs",
  "django-stubs-ext",
  "mypy",
  "pyrefly",
  "types-channels",
]

[build-system]
requires = ["hatch-vcs", "hatchling"]
build-backend = "hatchling.build"

[tool.coverage.run]
source_pkgs = ["django_workspaces", "tests"]
branch = true
parallel = true
omit = [
  "src/django_workspaces/__about__.py",
]

[tool.coverage.paths]
django_workspaces = [
  "src/django_workspaces",
  "*/django-workspaces/src/django_workspaces",
]
tests = ["tests", "*/django-workspaces/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.deptry]
known_first_party = ["django_workspaces"]

[tool.django-stubs]
django_settings_module = "demo.settings"

[tool.hatch]
requires-hatch = ">=1.18.0"

[tool.hatch.build.targets.wheel]
sources = ["src"]

[tool.hatch.build.targets.sdist]
exclude = ["/.devcontainer", "/.github"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.envs.default]
dependency-groups = ["dev"]
features = ["channels"]
dependencies = ["types-channels"]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
test-cov = "coverage run -m pytest {args:tests}"
cov-report = [
  "- coverage combine",
  "coverage report",
]
cov = [
  "test-cov",
  "cov-report",
]

[tool.hatch.envs.hatch-check-types]
dependency-groups = ["types"]

[tool.hatch.envs.hatch-check-types.scripts]
check = [
  "pyrefly check{env:HATCH_CHECK_TYPES_ARGS:} {args}",
  "mypy {args}",
]

[tool.hatch.envs.hatch-test]
dependency-groups = ["dev"]
features = ["channels"]
extra-dependencies = ["types-channels"]

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

[[tool.hatch.envs.hatch-test.matrix]]
django = ["5.2"]
python = ["3.10", "3.11", "3.12", "3.13", "3.14"]

[[tool.hatch.envs.hatch-test.matrix]]
django = ["6.0"]
python = ["3.12", "3.13", "3.14"]

[[tool.hatch.envs.hatch-test.matrix]]
django = ["6.1"]
python = ["3.12", "3.13", "3.14", "3.15"]

[tool.hatch.envs.hatch-test.overrides]
matrix.django.dependencies = [
  { value = "django>=5.2,<6.0", if = ["5.2"] },
  { value = "django>=6.0,<6.1", if = ["6.0"] },
  { value = "django>=6.1,<6.2", if = ["6.1"] },
]

[tool.hatch.envs.hatch-check-code]
config-path = "none"
dependencies = ["ruff"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["mypy_django_plugin.main"]
enable_error_code = ["deprecated"]

[tool.pyrefly]
project-includes = ["src"]
project-excludes = ["**/migrations"]
preset = "strict"
min-severity = "ignore"

[tool.pytest]
pythonpath = [".", "src"]
DJANGO_SETTINGS_MODULE = "demo.settings"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
  "A",
  "ANN",
  "ARG",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "C90",
  "COM",
  "D",
  "DJ",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "EXE",
  "F",
  "FA",
  "FBT",
  "FIX",
  "FLY",
  "FURB",
  "G",
  "I",
  "ICN",
  "INP",
  "INT",
  "ISC",
  "LOG",
  "N",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "SLOT",
  "T10",
  "T20",
  "TC",
  "TD",
  "TID",
  "TRY",
  "UP",
  "W",
  "YTT",
]
ignore = ["COM812", "SIM105"]
typing-modules = ["django_workspaces._compat"]

[tool.ruff.lint.extend-per-file-ignores]
"*/migrations/*" = ["RUF012", "D"]
"*/models.py" = ["D106"]
"*/urls.py" = ["D"]
"tests/*" = ["S101", "D"]
"demo/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
ignore-decorators = ["typing.overload"]

[tool.ruff.lint.flake8-self]
ignore-names = ["_default_manager", "_meta"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"
